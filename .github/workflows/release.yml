name: Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Pakete fuer Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Abhaengigkeiten
        run: |
          npm install -g npm@11.6.2
          npm ci

      - name: Tests
        run: cargo test --release -p multipass-core

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "MultiPass __VERSION__"
          releaseBody: |
            Installer fuer Windows, macOS und Linux. Die Installer sind nicht signiert.
            Windows: MultiPass_x.y.z_x64-setup.exe herunterladen und starten. Bei "Der Computer wurde durch Windows geschuetzt" auf "Weitere Informationen" und dann "Trotzdem ausfuehren" klicken.
            macOS: .dmg oeffnen, MultiPass in "Programme" ziehen, beim ersten Start mit Rechtsklick auf MultiPass "Oeffnen" waehlen.
            Linux: .AppImage oder .deb.
            Kommandozeile: multipass-cli-<system> herunterladen, Hilfe mit "multipass-cli --hilfe".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Kommandozeilen-Programm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.args }}" in
            *aarch64-apple-darwin*) target=aarch64-apple-darwin; name=macos-arm64 ;;
            *x86_64-apple-darwin*) target=x86_64-apple-darwin; name=macos-x64 ;;
            *) target=""; name="$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]')-x64" ;;
          esac
          if [ -n "$target" ]; then
            cargo build --release -p multipass-cli --target "$target"
            bin="target/$target/release/multipass-cli"
          else
            cargo build --release -p multipass-cli
            bin="target/release/multipass-cli"
          fi
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "$bin$ext" "multipass-cli-$name$ext"
          gh release upload "v${{ steps.tauri.outputs.appVersion }}" "multipass-cli-$name$ext" --clobber
