name: Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Pakete fuer Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Abhaengigkeiten
        run: npm ci

      - name: Tests
        run: cargo test --release -p multipass-core

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "MultiPass __VERSION__"
          releaseBody: |
            Installer fuer Windows, macOS und Linux. Die Installer sind nicht signiert.
            Windows: MultiPass_x.y.z_x64-setup.exe herunterladen und starten. Bei "Der Computer wurde durch Windows geschuetzt" auf "Weitere Informationen" und dann "Trotzdem ausfuehren" klicken.
            macOS: .dmg oeffnen, MultiPass in "Programme" ziehen, beim ersten Start mit Rechtsklick auf MultiPass "Oeffnen" waehlen.
            Linux: .AppImage oder .deb.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
